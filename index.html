<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT Trade - AI Trading Signals</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --primary-color: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 22px;
            color: #fff;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        select {
            width: 100%;
            padding: 12px;
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        .btn-analyze {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 5px;
        }

        .btn-analyze:active {
            transform: scale(0.98);
        }

        .btn-analyze:hover {
            opacity: 0.9;
        }

        #result-box {
            margin-top: 20px;
            display: none;
            background: #1f2937;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #374151;
            animation: fadeIn 0.4s ease;
        }

        .loading-spinner {
            text-align: center;
            padding: 15px;
            color: var(--primary-color);
            font-size: 14px;
            font-weight: bold;
        }

        .signal-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 10px;
            border-bottom: 1px solid #374151;
            padding-bottom: 8px;
        }

        .signal-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .signal-badge {
            font-size: 18px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .buy { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .sell { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

        .confidence {
            text-align: left;
            font-size: 14px;
        }

        .confidence span {
            color: var(--accent-green);
            font-weight: bold;
        }

        .btn-trade {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--accent-green);
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: background 0.2s;
        }

        .btn-trade:hover {
            background: #059669;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #6b7280;
            margin-top: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🤖 GPT Trade AI</h1>
            <p>منصة التحليل الفني اللحظي للخيارات الثنائية</p>
        </div>

        <div class="form-group">
            <label for="asset">اختر الأصل المالي (Asset):</label>
            <select id="asset">
                <option value="EUR/USD (OTC)">EUR/USD (OTC)</option>
                <option value="GBP/USD (OTC)">GBP/USD (OTC)</option>
                <option value="AUD/CAD (OTC)">AUD/CAD (OTC)</option>
                <option value="USD/JPY (OTC)">USD/JPY (OTC)</option>
                <option value="Bitcoin (Crypto)">Bitcoin (Crypto)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="timeframe">الإطار الزمني للصفقة:</label>
            <select id="timeframe">
                <option value="5 ثوانٍ (S5)">5 ثوانٍ (S5)</option>
                <option value="15 ثانية (S15)">15 ثانية (S15)</option>
                <option value="1 دقيقة (M1)">دقيقة واحدة (M1)</option>
            </select>
        </div>

        <button class="btn-analyze" onclick="startAnalysis()">الحصول على إشارة ذكية ⚡</button>

        <div id="result-box">
            <div id="loading" class="loading-spinner">
                🔄 جاري فحص سيولة السوق ومؤشرات (RSI, EMA, Momentum)...
            </div>
            <div id="signal-content" style="display: none;">
                <div class="signal-header">
                    <span id="res-asset">EUR/USD</span>
                    <span id="res-time">5 ثوانٍ</span>
                </div>
                <div class="signal-body">
                    <div id="res-badge" class="signal-badge">🟢 BUY</div>
                    <div class="confidence">نسبة الدقة:<br><span id="res-conf">94%</span></div>
                </div>
                <!-- استبدل الرابط أدناه برابط الإحالة الخاص بك (Affiliate Link) -->
                <a id="trade-link" href="https://pocketoption.com" target="_blank" class="btn-trade">🚀 تنفيذ الصفقة على المنصة</a>
            </div>
        </div>

        <div class="footer-note">
            ⚠️ للتداول مخاطر عالية، هذه الإشارات لأغراض توضيحية وتقنية.
        </div>
    </div>

    <script>
        function startAnalysis() {
            const asset = document.getElementById("asset").value;
            const timeframe = document.getElementById("timeframe").value;
            
            const resultBox = document.getElementById("result-box");
            const loading = document.getElementById("loading");
            const content = document.getElementById("signal-content");
            
            resultBox.style.display = "block";
            loading.style.display = "block";
            content.style.display = "none";
            
            // محاكاة وقت المعالجة الفنية (ثانيتان)
            setTimeout(() => {
                loading.style.display = "none";
                content.style.display = "block";
                
                // توليد إشارة عشوائية (صعود أو هبوط)
                const isBuy = Math.random() >= 0.4;
                const badge = document.getElementById("res-badge");
                
                if (isBuy) {
                    badge.className = "signal-badge buy";
                    badge.innerHTML = "🟢 صعود (BUY)";
                } else {
                    badge.className = "signal-badge sell";
                    badge.innerHTML = "🔴 هبوط (SELL)";
                }
                
                document.getElementById("res-asset").innerText = asset;
                document.getElementById("res-time").innerText = timeframe;
                document.getElementById("res-conf5s") // للاحتياط
                
                // نسبة دقة عشوائية بين 88% و 97%
                const randomConf = Math.floor(Math.random() * (97 - 88 + 1)) + 88;
                document.getElementById("res-conf").innerText = randomConf + "%";
                
            }, 2000);
        }
    </script>
</body>
</html>
