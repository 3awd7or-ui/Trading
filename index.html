<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT trade - Real Market Analysis</title>
    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: #131b2e;
            --panel-bg: #192238;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #8a99ad;
            --border-color: #24304d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 410px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .app-brand {
            font-weight: 700;
            font-size: 16px;
            color: #fff;
        }

        .asset-select {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }

        .timeframes-bar {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-bottom: 14px;
        }

        .tf-chip {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 0;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
        }

        .tf-chip.active {
            background: var(--accent-green);
            color: #0b0f17;
            border-color: var(--accent-green);
            font-weight: 700;
        }

        .ai-banner {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .ai-status-title {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .btn-analyze {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #059669, var(--accent-green));
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-analyze:hover {
            opacity: 0.9;
        }

        .readings-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin-top: 14px;
        }

        .reading-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 55px;
        }

        .rc-top {
            font-size: 11px;
            color: var(--text-muted);
        }

        .rc-bottom {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            margin-top: 4px;
        }

        .trend-up { color: var(--accent-green); }
        .trend-down { color: var(--accent-red); }
        
        .price-display {
            font-size: 12px;
            color: #f59e0b;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div class="app-brand">⚡ GPT trade (Live API)</div>
            <select id="asset-select" class="asset-select" onchange="fetchRealMarketData()">
                <option value="BTCUSDT">Bitcoin (BTC/USDT)</option>
                <option value="ETHUSDT">Ethereum (ETH/USDT)</option>
                <option value="SOLUSDT">Solana (SOL/USDT)</option>
                <option value="BNBUSDT">Binance Coin (BNB)</option>
            </select>
        </div>

        <div class="timeframes-bar">
            <div class="tf-chip active" onclick="setTF(this, '1m')">1m</div>
            <div class="tf-chip" onclick="setTF(this, '5m')">5m</div>
            <div class="tf-chip" onclick="setTF(this, '15m')">15m</div>
            <div class="tf-chip" onclick="setTF(this, '1h')">1h</div>
            <div class="tf-chip" onclick="setTF(this, '4h')">4h</div>
        </div>

        <div class="ai-banner">
            <div class="ai-status-title" id="status-title">Ready for real analysis</div>
            <div class="price-display" id="live-price">Current Price: Loading...</div>
            <button class="btn-analyze" onclick="fetchRealMarketData()">Analyze Live Data 🚀</button>
        </div>

        <div class="readings-grid">
            <div class="reading-card">
                <div class="rc-top">Live Trend</div>
                <div class="rc-bottom" id="val-trend">--</div>
            </div>
            <div class="reading-card">
                <div class="rc-top">RSI (14) - Real</div>
                <div class="rc-bottom" id="val-rsi">--</div>
            </div>
            <div class="reading-card">
                <div class="rc-top">SMA 20 vs Price</div>
                <div class="rc-bottom" id="val-sma">--</div>
            </div>
            <div class="reading-card">
                <div class="rc-top">Real Summary</div>
                <div class="rc-bottom" id="val-summary">--</div>
            </div>
        </div>
    </div>

    <script>
        let currentInterval = "1m";

        function setTF(element, tf) {
            document.querySelectorAll('.tf-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            currentInterval = tf;
            fetchRealMarketData();
        }

        // دالة جلب البيانات الحقيقية من Binance API وحساب المؤشرات الفنية فعلياً
        async function fetchRealMarketData() {
            const symbol = document.getElementById("asset-select").value;
            const statusTitle = document.getElementById("status-title");
            statusTitle.innerText = "Fetching live candle data...";

            try {
                // جلب آخر 50 شمعة تاريخية للسوق الحقيقي
                const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${currentInterval}&limit=50`);
                const data = await response.json();

                // استخراج أسعار الإغلاق (Close Prices) من الشمعات الحقيقية
                const closes = data.map(candle => parseFloat(candle[4]));
                const currentPrice = closes[closes.length - 1];
                
                document.getElementById("live-price").innerText = `Live Price: $${currentPrice.toLocaleString()}`;

                // 1. حساب المتوسط المتحرك البسيط SMA 20
                const sma20 = calculateSMA(closes, 20);
                
                // 2. حساب مؤشر القوة النسبية RSI 14 الحقيقي
                const rsi = calculateRSI(closes, 14);

                // تحديد الاتجاه والملخص بناءً على الحسابات الحقيقية
                const trendEl = document.getElementById("val-trend");
                const rsiEl = document.getElementById("val-rsi");
                const smaEl = document.getElementById("val-sma");
                const sumEl = document.getElementById("val-summary");

                rsiEl.innerText = rsi.toFixed(1);

                if (currentPrice > sma20) {
                    smaEl.innerHTML = '<span class="trend-up">Above SMA (Bullish)</span>';
                } else {
                    smaEl.innerHTML = '<span class="trend-down">Below SMA (Bearish)</span>';
                }

                if (currentPrice > closes[closes.length - 2]) {
                    trendEl.innerHTML = '<span class="trend-up">Upward ↑</span>';
                } else {
                    trendEl.innerHTML = '<span class="trend-down">Downward ↓</span>';
                }

                // اتخاذ القرار بناءً على قيمة RSI الحقيقية وموقع السعر من المتوسط
                if (rsi < 45 && currentPrice > sma20) {
                    sumEl.innerHTML = '<span class="trend-up">STRONG BUY 🟢</span>';
                    statusTitle.innerText = "Analysis: Oversold in Uptrend (Buy Signal)";
                } else if (rsi > 55 && currentPrice < sma20) {
                    sumEl.innerHTML = '<span class="trend-down">STRONG SELL 🔴</span>';
                    statusTitle.innerText = "Analysis: Overbought in Downtrend (Sell Signal)";
                } else {
                    sumEl.innerHTML = '<span>NEUTRAL ⚪</span>';
                    statusTitle.innerText = "Analysis: Market Consolidating";
                }

            } catch (error) {
                statusTitle.innerText = "Error fetching market data!";
                console.error(error);
            }
        }

        // حساب المتوسط المتحرك البسيط (SMA)
        function calculateSMA(data, period) {
            const slice = data.slice(-period);
            const sum = slice.reduce((a, b) => a + b, 0);
            return sum / period;
        }

        // حساب مؤشر القوة النسبية الحقيقي (RSI)
        function calculateRSI(closes, period) {
            let gains = 0;
            let losses = 0;

            for (let i = closes.length - period; i < closes.length; i++) {
                const diff = closes[i] - closes[i - 1];
                if (diff >= 0) {
                    gains += diff;
                } else {
                    losses -= diff;
                }
            }

            let avgGain = gains / period;
            let avgLoss = losses / period;

            if (avgLoss === 0) return 100;
            let rs = avgGain / avgLoss;
            return 100 - (100 / (1 + rs));
        }

        // تشغيل الجلب تلقائياً عند تحميل الصفحة
        window.onload = function() {
            fetchRealMarketData();
        };
    </script>
</body>
</html>
